name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest --cov=bioeng_qpcr --cov-branch

  package-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-build]"
      - run: python -m PyInstaller --clean --noconfirm bioeng-qpcr.spec
      - name: Smoke-test packaged GUI imports
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\bioeng-qpcr\bioeng-qpcr.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged GUI smoke test failed with exit code $($process.ExitCode)"
          }
