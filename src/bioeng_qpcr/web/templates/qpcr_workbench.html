<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>qPCR Lab · 实验工作台</title>
<style>
:root{--bg:#f4f6f3;--paper:#fff;--ink:#233c31;--muted:#738178;--line:#e0e7e0;--green:#27684e;--pale:#edf4ee;--orange:#a66b22;--red:#ac4140;--mono:Consolas,'Cascadia Code',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.6px}h2{font-size:17px}h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{background:#fdfefd;border-right:1px solid var(--line);padding:27px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 27px}.brandmark{background:var(--green);color:white;width:36px;height:39px;border-radius:10px;display:grid;place-items:center;font:bold 16px var(--mono)}.brand b{font-size:19px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted)}.navlabel{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;color:var(--muted);padding:14px 12px}.navbutton{width:100%;display:flex;gap:11px;align-items:center;border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:7px;margin:3px 0;font-size:13px}.navbutton.active{background:var(--pale);color:var(--green);font-weight:600}.navbutton:hover{background:#f3f6f1}.navnumber{font:11px var(--mono);border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}.navbutton.active .navnumber{background:var(--green);border-color:var(--green);color:white}.navdot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#cdd7ce}.navdot.complete{background:#4c9a6c}.navdot.blocked{background:var(--red)}.navdot.stale{background:#d9a052}.sidebarfooter{margin-top:auto;padding:18px 10px 0;font-size:11px;border-top:1px solid var(--line);color:var(--muted)}.sidebarfooter a{display:block;margin-top:9px;text-decoration:none}.main{min-width:0}.topbar{height:70px;padding:0 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.7)}.topbar .spacer{flex:1}.topbar select{max-width:290px}.content{max-width:1600px;margin:auto;padding:30px 32px 45px}.pageheading{display:flex;align-items:center;gap:16px;margin-bottom:23px}.pageheading .spacer{flex:1}.eyebrow{font:11px var(--mono);color:var(--green);letter-spacing:1.5px;margin-bottom:7px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 14px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:12px;white-space:nowrap}.btn:hover{border-color:var(--green);background:#f5f9f4}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:var(--red)}.btn.tiny{padding:3px 8px;font-size:11px}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;background:white;color:var(--muted)}.pill.complete,.pill.PASS{color:var(--green);background:var(--pale);border-color:#cce1d1}.pill.WARN,.pill.stale{color:var(--orange);background:#fff6e8;border-color:#f0dfbf}.pill.FAIL,.pill.blocked{color:var(--red);background:#fff0ef;border-color:#edd0ca}.pill.ready{color:var(--green);border-color:#abcab6}.pill.NOT_ASSESSABLE{background:#f0f2f5;color:#65738b}.flow{display:grid;grid-template-columns:repeat(8,minmax(80px,1fr));background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:25px;overflow:auto}.flownode{position:relative;border:0;background:transparent;padding:15px 5px;text-align:center;color:var(--muted);font-size:11px;min-width:80px}.flownode:not(:last-child):after{content:'›';position:absolute;right:-3px;top:19px;color:#b8c6b9;font-size:18px}.flownode.active{background:var(--pale);color:var(--green)}.flowcircle{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;font:11px var(--mono)}.flownode.complete .flowcircle{background:var(--green);border-color:var(--green);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:22px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.card+.card{margin-top:18px}.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}.cardhead .spacer{flex:1}.hint{color:var(--muted);font-size:12px;margin:6px 0 16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric{padding:18px;background:white;border:1px solid var(--line);border-radius:8px}.metric .value{font:25px var(--mono);margin:5px 0}.metric .label{color:var(--muted);font-size:11px}.fieldgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);background:#fcfdfb;padding:7px 9px;border-radius:5px;color:var(--ink);min-width:0;max-width:100%}input[type=checkbox]{accent-color:var(--green)}textarea{width:100%;min-height:110px;font:12px/1.6 var(--mono)}.field input,.field select{width:100%;font-size:13px}input[type=number]{width:95px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;font-weight:500;padding:9px 8px;border-bottom:1px solid var(--line);background:#fafcf8;white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid #eef1eb;vertical-align:top;white-space:nowrap}td input:not([type=checkbox]){width:115px;font-size:12px;padding:5px}td input.seq{width:180px;font-family:var(--mono)}td select{font-size:12px;padding:5px}td.wrap{white-space:normal;min-width:180px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.actions .spacer{flex:1}.aside h3{font-size:12px;margin-bottom:12px}.aside .summaryrow{display:flex;justify-content:space-between;gap:10px;margin:10px 0;font-size:11px}.aside p{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.aside .card{padding:19px}.source a{font-size:11px;word-break:break-all}.sourcetitle{font-size:12px;margin-bottom:7px}.source+.source{margin-top:17px;padding-top:14px;border-top:1px solid var(--line)}.notice{border:1px solid #e8d8b8;background:#fffaf0;border-radius:7px;padding:12px 14px;font-size:12px;color:#8b642c;margin:14px 0}.notice.green{background:var(--pale);border-color:#cce1d1;color:var(--green)}.notice.red{background:#fff1ef;color:var(--red);border-color:#ebcbc8}.plate{display:grid;gap:4px;min-width:530px;padding:12px 0}.well{aspect-ratio:1;border:1px solid #dde6dd;border-radius:50%;background:#f5f8f2;color:#87998a;font:9px var(--mono);padding:0;min-width:0}.well.assigned{background:#d1e6d6;color:#2d6446;border-color:#a8cdb3}.well.standard{background:#e9dfbd;border-color:#d5c38d;color:#8a6a1e}.well.ntc,.well.negative{background:#e9eaf0;color:#6c7391}.well.selected{box-shadow:0 0 0 2px var(--green)}.well:hover{border:2px solid var(--green)}.platelabel{display:grid;place-items:center;font:10px var(--mono);color:var(--muted)}.legend{display:flex;gap:15px;font-size:10px;color:var(--muted);margin:12px 0}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d1e6d6;margin-right:4px}.legend i.std{background:#e9dfbd}.legend i.ntc{background:#e9eaf0}.chart{width:100%;height:auto;min-height:240px;display:block}.chart text{font:10px 'Segoe UI',sans-serif;fill:#75867a}.chartpair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.charttitle{font-size:12px;font-weight:600;margin:12px 0 2px}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.empty h2{margin-bottom:8px;color:var(--ink)}.demos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}.democard{padding:27px;text-align:left;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.democard:hover{border-color:var(--green)}.democard strong{font-size:17px;display:block;margin:8px 0}.democard p{font-size:12px;color:var(--muted)}.auditrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.progress{height:5px;border-radius:5px;background:#e4ece2;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--green)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;max-width:80vw;padding:12px 20px;background:#233c31;color:white;border-radius:8px;box-shadow:0 6px 24px #0002;display:none}#toast.error{background:#913d3d}.savebar{position:sticky;bottom:10px;background:#fffffff2;backdrop-filter:blur(12px);padding:13px 18px;border:1px solid var(--line);border-radius:8px;margin-top:20px;display:flex;gap:10px;align-items:center}.savebar .spacer{flex:1}.downloadgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.downloadgrid .btn{justify-content:flex-start;padding:15px}.checkfield{display:flex;align-items:flex-start;gap:9px;padding:13px;border:1px solid var(--line);background:#fafcf8;border-radius:6px;font-size:12px;margin:14px 0}.checkfield input{margin-top:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.runline{font-size:12px;padding:14px;border-left:2px solid #c1d9c5;margin:10px 0;background:#f8faf6}.runline strong{display:block}.runline small{color:var(--muted);overflow-wrap:anywhere}.busy{pointer-events:none;opacity:.6}.mobilemenu{display:none}.hidden{display:none!important}
@media(min-width:1600px){.content{padding-left:42px;padding-right:42px}.grid{grid-template-columns:minmax(0,1fr) 290px}}@media(max-width:1200px){.shell{grid-template-columns:190px minmax(0,1fr)}.content{padding:24px 20px}.topbar{padding:0 20px}.grid{grid-template-columns:minmax(0,1fr)}.aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}.aside .card+.card{margin-top:0}.fieldgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:30;width:230px;box-shadow:0 0 0 100vw #0005}.mobilemenu{display:block}.topbar{height:auto;min-height:65px;padding:12px;flex-wrap:wrap}.topbar select{max-width:180px}.content{padding:20px 12px}.pageheading{flex-wrap:wrap}h1{font-size:23px}.metrics{grid-template-columns:1fr 1fr;gap:9px}.fieldgrid,.chartpair,.split,.demos,.aside{grid-template-columns:1fr}.card{padding:16px}.flow{grid-template-columns:repeat(8,90px)}.savebar{flex-wrap:wrap}.downloadgrid{grid-template-columns:1fr}.pill.local{display:none}}
.figure-toolbar{margin-bottom:18px;background:linear-gradient(110deg,#fff,#f6f9f5)}.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.theme-card{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;color:var(--ink)}.theme-card:hover{border-color:var(--green);box-shadow:0 6px 20px #204d3010}.theme-card svg{display:block;width:100%;margin-bottom:12px}.theme-card strong{font-size:14px}.theme-card p{font-size:11px;color:var(--muted);margin-top:4px}.swatches{display:flex;gap:5px;margin-top:12px}.swatches i{width:14px;height:14px;border-radius:50%}.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.template-grid .democard{padding:21px}.template-grid .democard strong{font-size:15px}.figure-downloads{display:flex;justify-content:flex-end;gap:6px;margin:7px 0 12px}.chart text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px}@media(max-width:760px){.theme-grid,.template-grid{grid-template-columns:1fr}.figure-toolbar .fieldgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">qL</div><div><b>qPCR Lab</b><small>EXPERIMENT WORKBENCH</small></div></div><div class="navlabel">实验空间 / WORKSPACE</div><button class="navbutton active" data-nav="overview"><span class="navnumber">⌂</span>实验总览</button><div class="navlabel">实验工作流 / WORKFLOW</div><nav id="navigation" aria-label="实验步骤"></nav><div class="sidebarfooter">● 本地保存 · 可追溯分析<br>研究与教学用途<a href="/">独立 qPCR 分析工具 ↗</a><a href="/lab">综合实验工作台 ↗</a></div></aside>
<main class="main"><header class="topbar"><button class="btn mobilemenu" data-action="menu" aria-label="打开步骤导航">☰</button><a href="/lab" class="btn">← 全部实验模块</a><span class="muted">/</span><select id="projectSelect" aria-label="选择实验项目"><option>加载中…</option></select><span class="spacer"></span><span class="pill local">● 本地工作台</span><button class="btn" id="restoreProjectBackup">恢复项目备份</button><input type="file" id="projectBackupFile" accept=".json" hidden><button class="btn" data-action="demo-menu">模板库</button><button class="btn primary" data-action="new">＋ 新建实验</button></header>
<div class="content"><div id="heading"></div><div id="workflow" class="flow hidden" aria-label="可视化实验工作流"></div><div id="body"></div></div></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const labels=['样品与引物 / 探针','反应体系与板位','温度循环与通道','运行与数据采集','Ct 与熔解曲线','质量控制','相对 / 绝对定量','结果与报告'];
const keys=['samples','design','program','acquisition','curves','qc','analysis','report'];
const short=['样品 / 引物','配液 / 板位','上机程序','运行 / 采集','Ct / 熔解','质量控制','定量分析','结果报告'];
const statusNames={pending:'待开始',ready:'可进行',complete:'已完成',stale:'需重新确认',blocked:'质控阻断',waiting_data:'等待数据'};
const kindNames={unknown:'普通样品',standard:'标准品',ntc:'无模板对照',positive:'阳性对照',negative:'阴性对照',nrt:'无逆转录对照'};
let catalog={themes:{},experiments:{}},svgCounter=0;
let project=null,draft=null,current='overview',dirty=false,busy=false,selectedWell='',projects=[],toastTimer;
function toast(message,error=false){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').className=error?'error':'';$('#toast').style.display='block';toastTimer=setTimeout(()=>$('#toast').style.display='none',error?10000:3500)}
async function api(url,options={}){const response=await fetch(url,{...options,headers:options.body instanceof FormData?{}:{'Content-Type':'application/json',...(options.headers||{})}});let data;try{data=await response.json()}catch{throw Error(`请求失败 (${response.status})`)}if(!response.ok||data.ok===false)throw Error(data.error||'操作失败');return data}
async function mutate(path,payload={}){const data=await api(`/api/qpcr/projects/${project.id}/${path}`,{method:'POST',body:JSON.stringify({revision:project.revision,...payload})});project=data.project;dirty=false;render();return project}
function pill(status,label){return `<span class="pill ${esc(status)}">${esc(label||statusNames[status]||status)}</span>`}
function options(rows,value,label='name',blank=false){return (blank?'<option value="">请选择</option>':'')+rows.map(row=>`<option value="${esc(row.id)}" ${row.id===value?'selected':''}>${esc(row[label]||row.id)}</option>`).join('')}
function select(values,value){return values.map(([id,label])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(label)}</option>`).join('')}
function input(value,path,type='text',extra=''){return `<input type="${type}" data-path="${esc(path)}" value="${esc(value)}" ${extra}>`}
function checkbox(value,path){return `<input type="checkbox" data-path="${esc(path)}" ${value?'checked':''}>`}
function field(label,value,path,type='text'){return `<label class="field">${esc(label)}${input(value,path,type)}</label>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function tr(cells){return '<tr>'+cells.map(c=>`<td>${c}</td>`).join('')+'</tr>'}
function removeButton(section,index){return `<button class="btn tiny danger" data-remove="${section}:${index}" aria-label="删除第 ${index+1} 行">×</button>`}
function card(title,content,hint='',actions=''){return `<section class="card"><div class="cardhead"><h2>${title}</h2><span class="spacer"></span>${actions}</div>${hint?`<p class="hint">${hint}</p>`:''}${content}</section>`}
function fmt(n,digits=3){return n===null||n===undefined?'—':typeof n==='number'?Number(n.toFixed(digits)).toLocaleString('en-US',{maximumFractionDigits:digits}):esc(n)}
function activeRun(){return project?.runs.find(r=>r.id===project.active_run_id)}
function changed(){dirty=true;$('#saveStatus')&&($('#saveStatus').textContent='有未保存修改');$('#localStatus')&&($('#localStatus').textContent='有未保存修改')}
function syncInputs(){if(!draft)return;if($('#channelList'))draft.program.channels=$('#channelList').value.split(',').map(s=>s.trim()).filter(Boolean);$$('[data-path]').forEach(el=>{let obj=draft,parts=el.dataset.path.split('.');for(const part of parts.slice(0,-1))obj=obj[part];obj[parts.at(-1)]=el.type==='checkbox'?el.checked:(el.type==='number'||el.dataset.numeric==='true')?(el.value===''?null:Number(el.value)):el.value});if($('#referenceChoices')){draft.analysis_settings.reference_ids=$$('[data-reference]:checked').map(el=>el.dataset.reference);draft.analysis_settings.reference_id=draft.analysis_settings.reference_ids[0]||''}const evidence=Object.assign(Object.create(null),draft.analysis_settings.efficiencies||{});$$('[data-efficiency]').forEach(el=>{const source=$$('[data-efficiency-source]').find(n=>n.dataset.efficiencySource===el.dataset.efficiency)?.value||'';evidence[el.dataset.efficiency]={value:el.value===''?null:Number(el.value),source}});if($$('[data-efficiency]').length)draft.analysis_settings.efficiencies=evidence}
function editedChanges(){const groups={overview:['name'],samples:['samples','assays'],design:['plate','plate_format','recipe'],program:['program'],curves:['curve_settings','presentation'],qc:['qc_policy'],analysis:['analysis_settings','presentation'],report:['presentation']};return Object.fromEntries((groups[current]||[]).filter(key=>JSON.stringify(draft[key])!==JSON.stringify(project[key])).map(key=>[key,draft[key]]))}
async function saveCurrent(){if(!project||!dirty)return true;syncInputs();const changes=editedChanges();if(Object.keys(changes).length){const result=await api(`/api/qpcr/projects/${project.id}`,{method:'PATCH',body:JSON.stringify({revision:project.revision,changes})});project=result.project}dirty=false;return true}
async function navigate(step){await saveCurrent();current=step;selectedWell='';$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}
async function refreshList(){const data=await api('/api/qpcr/projects');projects=data.projects;$('#projectSelect').innerHTML=projects.length?projects.map(p=>`<option value="${p.id}" ${p.id===project?.id?'selected':''}>${esc(p.name)}</option>`).join(''):'<option value="">尚无实验</option>'}
async function loadProject(id){await saveCurrent();const data=await api('/api/qpcr/projects/'+id);project=data.project;localStorage.setItem('qpcr-project',id);current='overview';dirty=false;render();await refreshList()}
async function create(demo=null,template=null){await saveCurrent();const data=await api('/api/qpcr/projects',{method:'POST',body:JSON.stringify({name:'新的 qPCR 实验',demo,template})});project=data.project;current='overview';dirty=false;localStorage.setItem('qpcr-project',project.id);render();await refreshList();toast(demo?'公开示例已创建，先确认设计，再回放采集数据':'实验已创建，请从样品与引物开始')}
function theme(){return catalog.themes[(draft||project)?.presentation?.theme]||{name:'期刊简洁',background:'#fff',ink:'#293c4a',grid:'#e4eaf0',palette:['#246b83','#da8550','#5b9c8a','#8871ad','#c3a448','#6a8bac']}}
function themeToolbar(){const v=draft.presentation;return `<section class="card figure-toolbar"><div class="fieldgrid"><label class="field">图表主题<select data-path="presentation.theme">${['journal','lab','accessible','mono','night','pastel'].map(id=>[id,catalog.themes[id]]).filter(([,t])=>t).map(([id,t])=>`<option value="${id}" ${v.theme===id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>${current==='curves'?`<label class="field">曲线叠加<select data-path="presentation.curve_scope">${select([['selected','仅选中孔'],['replicates','同一样品的技术重复'],['all','叠加全部孔']],v.curve_scope)}</select></label>`:''}${current==='analysis'?`<label class="field">相对定量图模板<select data-path="presentation.relative_chart">${select([['lollipop','棒棒糖图 · 点估计'],['bar','水平柱状图'],['dot','点图 · 点估计']],v.relative_chart)}</select></label>`:''}</div><p class="hint" style="margin:10px 0 0">样式独立保存，计算结果保持不变。矢量图可下载为 SVG / PDF，PNG 为 300 dpi。</p></section>`}
function themePreview(t){return `<svg viewBox="0 0 220 90" aria-hidden="true"><rect width="220" height="90" rx="7" fill="${t.background}"/><path d="M22 18V71H205M22 48H205M22 28H205" fill="none" stroke="${t.grid}"/><path d="M24 69C60 69 72 66 91 53S111 21 143 21H200" fill="none" stroke="${t.palette[0]}" stroke-width="2.5"/><path d="M24 70C90 70 107 65 124 48S146 30 200 30" fill="none" stroke="${t.palette[1]}" stroke-width="2" stroke-dasharray="4 3"/></svg>`}
function templateLibrary(){return `<section style="margin-top:34px;text-align:left"><div class="eyebrow">PLAN YOUR NEXT EXPERIMENT</div><h2>实验流程模板</h2><p class="hint">预填样品、板位、对照、通道与程序；不包含测量数据，所有配置都可修改。</p><div class="template-grid">${['expression','standard','melt','multiplex','controls'].map(id=>[id,catalog.experiments[id]]).filter(([,t])=>t).map(([id,t])=>`<button class="democard" data-template="${id}"><span class="pill">${t.category}</span><strong>${esc(t.name)}</strong><p>${esc(t.description)}</p><div class="small muted" style="margin-top:15px">96 孔板 · 预分配 ${t.wells} 个物理孔 →</div></button>`).join('')}</div><div class="eyebrow" style="margin-top:30px">PRESENT YOUR EVIDENCE</div><h2>图表与报告主题</h2><p class="hint">主题预览中的示意线仅展示样式；真实图表始终使用实际观测。</p><div class="theme-grid">${['journal','lab','accessible','mono','night','pastel'].map(id=>[id,catalog.themes[id]]).filter(([,t])=>t).map(([id,t])=>`<button class="theme-card" data-theme="${id}">${themePreview(t)}<strong>${esc(t.name)}</strong><p>${esc(t.description)}</p><span class="swatches">${t.palette.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('')}</div></section>`}
async function chooseTheme(id){if(!project){toast('请先打开公开示例，或创建实验模板');return}await saveCurrent();const data=await api(`/api/qpcr/projects/${project.id}`,{method:'PATCH',body:JSON.stringify({revision:project.revision,changes:{presentation:{...project.presentation,theme:id}}})});project=data.project;current=project.outputs.analysis?'analysis':project.outputs.curves?'curves':'overview';render();toast('已应用'+catalog.themes[id].name+'主题，计算结果保持不变')}
function figureLinks(kind){const selection=current==='curves'?$('#curveSelect')?.value:null;let params='';if(selection){const [well,assay]=JSON.parse(selection);params=`?well=${encodeURIComponent(well)}&assay=${encodeURIComponent(assay)}`}return `<div class="figure-downloads">${['svg','png','pdf'].map(fmt=>`<a class="btn tiny" data-figure="${kind}.${fmt}" href="/api/qpcr/projects/${project.id}/figures/${kind}.${fmt}${params}">↓ ${fmt.toUpperCase()}</a>`).join('')}</div>`}
function sourceAside(){const run=activeRun(),done=project.completed.length;return `<aside class="aside">${card('实验摘要',`<div class="summaryrow"><span>当前版本</span><b class="mono">r${project.revision}</b></div><div class="summaryrow"><span>板型 / 已分配孔</span><b>${project.plate_format} / ${new Set(project.plate.map(a=>a.well)).size}</b></div><div class="summaryrow"><span>数据模式</span><b>${run?run.mode==='public_replay'?'公开数据回放':'文件导入':'尚未采集'}</b></div><div class="summaryrow"><span>流程进度</span><b>${done} / 8</b></div><div class="progress"><div style="width:${done/8*100}%"></div></div><p style="margin-top:14px">● ${esc(run?run.status==='waiting_data'?'等待导入或回放':'数据已采集':'设备未连接')}<br>自动保存于本机 SQLite。设计确认后生成运行快照。</p>`)}${card('数据来源与边界',project.sources.length?project.sources.map(source=>`<div class="source"><div class="sourcetitle">${esc(source.title)}</div><a href="${safeUrl(source.url)}" target="_blank" rel="noreferrer">查看公开来源 ↗</a><p style="margin-top:7px">${esc(source.selection)}</p><p style="margin-top:7px">${esc(source.limitations)}</p><p class="mono small" style="margin-top:8px">${esc(source.license)}</p></div>`).join(''):'<p>真实实验项目。采集文件导入后记录文件名、SHA-256 和导入时间。请在样品备注中记录来源。</p>')}</aside>`}
function safeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
function render(){draft=project?clone(project):null;$('#navigation').innerHTML=keys.map((key,i)=>`<button class="navbutton ${current===key?'active':''}" data-nav="${key}"><span class="navnumber">${String(i+1).padStart(2,'0')}</span>${labels[i]}<span class="navdot ${project?.workflow[i].status||''}"></span></button>`).join('');$$('[data-nav="overview"]').forEach(el=>el.classList.toggle('active',current==='overview'));
 if(!project){$('#heading').innerHTML='';$('#workflow').classList.add('hidden');$('#body').innerHTML=welcome();return}
 const node=project.workflow.find(n=>n.key===current);$('#heading').innerHTML=`<div class="pageheading"><div><div class="eyebrow">${current==='overview'?'EXPERIMENT OVERVIEW':`STEP ${String(keys.indexOf(current)+1).padStart(2,'0')} / EXPERIMENT WORKFLOW`}</div><h1>${current==='overview'?'实验总览':labels[keys.indexOf(current)]}</h1><p class="muted small" style="margin-top:5px">${esc(project.name)} <span class="mono">· r${project.revision}</span></p></div><span class="spacer"></span>${node?pill(node.status):pill('ready',project.demo_key?'公开数据示例':'本地实验项目')}<span class="muted small" id="localStatus">修改已保存至本机</span></div>`;
 $('#workflow').classList.remove('hidden');$('#workflow').innerHTML=project.workflow.map((n,i)=>`<button class="flownode ${n.status} ${current===n.key?'active':''}" data-nav="${n.key}" title="${esc(statusNames[n.status])}"><span class="flowcircle">${n.status==='complete'?'✓':i+1}</span>${short[i]}</button>`).join('');
 const views={overview:overviewView,samples:samplesView,design:designView,program:programView,acquisition:acquisitionView,curves:curvesView,qc:qcView,analysis:analysisView,report:reportView};$('#body').innerHTML=`<div class="grid"><div>${['curves','analysis','report'].includes(current)?themeToolbar():''}${views[current]()}${current==='overview'?'':savebar()}</div>${sourceAside()}</div>`;
 if(current==='curves')drawCurves();if(current==='analysis')drawAnalysis();if(current==='design')drawPlate();}
function welcome(){return `<div class="empty"><div class="eyebrow">FROM DESIGN TO EVIDENCE</div><h1>把一次实验，连成完整的工作流。</h1><p style="margin-top:12px">从样品和板位，到可追溯的 Ct、质控与定量报告。先用公开数据走一遍。</p><div class="demos"><button class="democard" data-demo="relative-ct"><span class="pill">RELATIVE QUANTIFICATION</span><strong>脑 / 肾基因表达对比</strong><p>CRAN pcr / Livak 公开 Ct 示例。24 条观测，计算 ΔΔCt，查看缺失证据如何进入报告。</p><span class="btn" style="margin-top:18px">打开 ΔΔCt 示例 →</span></button><button class="democard" data-demo="rdml-dilution"><span class="pill">ABSOLUTE QUANTIFICATION</span><strong>DNA 稀释与标准曲线</strong><p>RDML 官方真实仪器数据。含标准量、原始扩增与熔解曲线，保留原始 384 孔地址。</p><span class="btn" style="margin-top:18px">打开标准曲线示例 →</span></button></div>${templateLibrary()}</div>`}
function savebar(){const node=project.workflow.find(n=>n.key===current),before=project.workflow.slice(0,keys.indexOf(current)),ready=before.every(n=>n.status==='complete');let action=({samples:'确认样品信息',design:'确认板位与配液',program:'确认上机程序',acquisition:'创建运行快照',curves:'计算 Ct 与熔解峰',qc:'执行质量控制',analysis:'执行定量分析',report:'生成报告版本'})[current];return `<div class="savebar"><span class="small muted" id="saveStatus">${ready?'上游步骤已完成':'需先完成上游步骤；可先编辑并保存本页'}</span><span class="spacer"></span>${['acquisition'].includes(current)?'':'<button class="btn" data-action="save">保存修改</button>'}<button class="btn primary" data-action="advance" ${ready?'':'disabled'} ${current==='acquisition'&&activeRun()?'disabled':''}>${action}</button>${node.status==='complete'&&keys.indexOf(current)<7?`<button class="btn" data-nav="${keys[keys.indexOf(current)+1]}">下一步 →</button>`:''}</div>`}
function overviewView(){const run=activeRun();return `<div class="metrics">${[['样品',project.samples.length],['检测项目',project.assays.length],['分配孔位',new Set(project.plate.map(a=>a.well)).size],['历史运行',project.runs.length]].map(([label,value])=>`<div class="metric"><div class="label">${label}</div><div class="value">${value.toString().padStart(2,'0')}</div><span class="muted small">${label==='历史运行'?'保留运行设计快照':'实验信息'}</span></div>`).join('')}</div>${card('实验信息',`<div class="fieldgrid">${field('实验名称',draft.name,'name')}</div><div class="actions"><button class="btn" data-action="save">保存名称</button><button class="btn primary" data-nav="${project.workflow.find(n=>n.status!=='complete')?.key||'report'}">${project.completed.length?'继续工作流':'开始确认实验设计'} →</button></div>`,project.demo_key?'此项目是可追溯的公开数据示例。教学配方与上机程序均有标注，不表示执行了真实硬件运行。':'先登记样品与引物，再设计板位和程序，采集文件将严格匹配当前设计。')}${card('工作流检查点',table(['步骤','当前状态','数据交付'],project.workflow.map((n,i)=>tr([`<button class="btn tiny" data-nav="${n.key}">${String(i+1).padStart(2,'0')} ${labels[i]}</button>`,pill(n.status),['稳定样品与检测项目 ID','板位与反应体系','温度循环和采集通道','不可变快照与原始测量','逐孔 Ct / Tm 与算法配置','PASS / WARN / FAIL / 无法评估','ΔΔCt 或已知单位的绝对量','CSV / JSON / HTML 报告'][i]]))))}${card('最近活动',project.audit.slice(-6).reverse().map(a=>`<div class="auditrow"><span class="mono small muted">${new Date(a.at).toLocaleString()}</span> <b>${esc(a.action)}</b><br><span class="muted">${esc(a.detail)}</span></div>`).join(''))}`}
function samplesView(){return card('样品信息',table(['样品 ID','显示名称','类型','分组','标准量','单位','备注',''],draft.samples.map((s,i)=>tr([`<span class="mono">${esc(s.id)}</span>`,input(s.name,`samples.${i}.name`),`<select data-path="samples.${i}.kind">${select(Object.entries(kindNames),s.kind)}</select>`,input(s.group,`samples.${i}.group`),input(s.quantity,`samples.${i}.quantity`,'number','step="any" min="0"'),input(s.unit,`samples.${i}.unit`),input(s.notes,`samples.${i}.notes`),removeButton('samples',i)])))+`<div class="actions"><button class="btn" data-action="add-sample">＋ 添加样品</button></div>`,'同一生物样品的技术重复共用样品 ID；独立生物学重复使用不同 ID。标准品必须填写正数和单位。')+card('引物 / 探针与检测项目',table(['检测 ID','名称','正向引物 5′–3′','反向引物 5′–3′','探针 5′–3′','检测化学','通道','内参','预期 Tm / °C',''],draft.assays.map((a,i)=>tr([`<span class="mono">${esc(a.id)}</span>`,input(a.name,`assays.${i}.name`),input(a.forward,`assays.${i}.forward`,'text','class="seq"'),input(a.reverse,`assays.${i}.reverse`,'text','class="seq"'),input(a.probe,`assays.${i}.probe`,'text','class="seq"'),`<select data-path="assays.${i}.chemistry">${select([['dye','染料法'],['probe','探针法']],a.chemistry)}</select>`,input(a.channel,`assays.${i}.channel`),checkbox(a.reference,`assays.${i}.reference`),input(a.expected_tm,`assays.${i}.expected_tm`,'number','step="any"'),removeButton('assays',i)])))+'<div class="actions"><button class="btn" data-action="add-assay">＋ 添加检测项目</button></div>','没有公开序列的信息保持为空，不自动生成引物。多重检测可共享物理孔，但通道必须不同。')}
function designView(){return card('板位布局',`<div class="fieldgrid"><label class="field">板型<select data-path="plate_format" data-numeric="true">${select([[96,'96 孔 · 8 × 12'],[384,'384 孔 · 16 × 24']],draft.plate_format)}</select></label><label class="field">待分配样品<select id="assignSample">${options(draft.samples,draft.samples[0]?.id)}</select></label><label class="field">待分配检测项目<select id="assignAssay">${options(draft.assays,draft.assays[0]?.id)}</select></label></div><div class="hint" style="margin-top:13px">点击孔位查看；选择样品与检测项目后分配到选中孔。空孔保持为空。</div><div class="tablewrap"><div id="plate" class="plate" role="group" aria-label="可编辑孔板"></div></div><div class="legend"><span><i></i>普通样品</span><span><i class="std"></i>标准品</span><span><i class="ntc"></i>对照</span></div><div class="actions"><span id="wellDetail" class="small muted">选择一个孔位</span><span class="spacer"></span><button class="btn" data-action="assign">分配到选中孔</button><button class="btn danger" data-action="clear-well">清空选中孔</button></div><details style="margin-top:18px"><summary class="small">批量排板与分配明细</summary><div class="actions"><label class="field">技术重复数<input id="replicates" type="number" min="1" max="12" value="3"></label><button class="btn" data-action="autoplate">按全部样品 × 检测项目重新排板</button></div><p class="hint">重新排板会替换当前分配；保存前可刷新恢复。多重检测请逐孔分配不同通道。</p><div id="assignmentTable"></div></details>`,'板位保存为“孔位 + 样品 ID + 检测 ID”。每次采集都冻结当时的设计。')+card('反应体系与配液清单',`<div class="fieldgrid">${field('每孔反应体积 / µL',draft.recipe.volume_ul,'recipe.volume_ul','number')}${field('配液余量 / %',draft.recipe.excess_percent,'recipe.excess_percent','number')}</div><p class="hint" style="margin-top:12px">${esc(draft.recipe.provenance)}</p>${table(['组分','每孔体积 / µL','估计总量 / µL',''],draft.recipe.components.map((c,i)=>tr([input(c.name,`recipe.components.${i}.name`),input(c.volume_ul,`recipe.components.${i}.volume_ul`,'number','step="any" min="0"'),fmt(c.volume_ul*new Set(draft.plate.map(a=>a.well)).size*(1+draft.recipe.excess_percent/100)),removeButton('recipe.components',i)])))}<div class="actions"><button class="btn" data-action="add-component">＋ 添加组分</button><span class="small muted">估计总量 = 每孔体积 × 物理孔数 × (1 + 余量)。模板须按样品单独加入。</span></div>`)}
function drawPlate(){const rows=draft.plate_format===384?16:8,cols=draft.plate_format===384?24:12;$('#plate').style.gridTemplateColumns=`20px repeat(${cols},minmax(18px,1fr))`;let content='<span></span>'+Array.from({length:cols},(_,i)=>`<span class="platelabel">${i+1}</span>`).join('');for(let r=0;r<rows;r++){content+=`<span class="platelabel">${String.fromCharCode(65+r)}</span>`;for(let c=1;c<=cols;c++){const well=String.fromCharCode(65+r)+String(c).padStart(2,'0'),assignments=draft.plate.filter(a=>a.well===well),sample=draft.samples.find(s=>s.id===assignments[0]?.sample_id);content+=`<button class="well ${sample?'assigned '+sample.kind:''} ${selectedWell===well?'selected':''}" data-well="${well}" title="${esc(well+' · '+(assignments.map(a=>a.sample_id+' / '+a.assay_id).join('; ')||'空孔'))}" aria-label="${esc(well+' '+(sample?.name||'空孔'))}">${c}</button>`}}$('#plate').innerHTML=content;$('#assignmentTable').innerHTML=table(['孔位','样品 ID','检测 ID'],draft.plate.map(a=>tr([esc(a.well),esc(a.sample_id),esc(a.assay_id)])));$('#wellDetail').textContent=selectedWell?selectedWell+' · '+(draft.plate.filter(a=>a.well===selectedWell).map(a=>a.sample_id+' / '+a.assay_id).join('; ')||'空孔'):'选择一个孔位'}
function programView(){return card('温度循环程序',`<div class="fieldgrid">${field('仪器名称 / 标识',draft.program.instrument,'program.instrument')}<label class="field">荧光通道（逗号分隔）<input id="channelList" value="${esc(draft.program.channels.join(', '))}"></label></div><p class="hint" style="margin-top:15px">相邻且循环次数相同的步骤组成一个重复循环块；采集标记表示在该步骤末读取荧光。</p>${table(['步骤','名称','温度 / °C','保持 / 秒','循环次数','采集荧光',''],draft.program.steps.map((s,i)=>tr([String(i+1),input(s.name,`program.steps.${i}.name`),input(s.temperature_c,`program.steps.${i}.temperature_c`,'number','step="any"'),input(s.seconds,`program.steps.${i}.seconds`,'number','step="any"'),input(s.cycles,`program.steps.${i}.cycles`,'number','step="1"'),checkbox(s.acquire,`program.steps.${i}.acquire`),removeButton('program.steps',i)])))}<div class="actions"><button class="btn" data-action="add-thermal">＋ 添加温度步骤</button><a class="btn" href="${exportUrl('protocol.json')}">导出已保存的程序与板位</a></div><div class="notice">设备未连接。此程序可供实验规划与记录，尚未向热循环仪下发命令。${esc(draft.program.provenance)}</div>`)+card('熔解扫描',`<label class="checkfield">${checkbox(draft.program.melt.enabled,'program.melt.enabled')}启用熔解扫描（探针法可关闭；缺少曲线时不会合成）</label><div class="fieldgrid">${field('起始温度 / °C',draft.program.melt.start_c,'program.melt.start_c','number')}${field('结束温度 / °C',draft.program.melt.end_c,'program.melt.end_c','number')}${field('温度步长 / °C',draft.program.melt.step_c,'program.melt.step_c','number')}</div>`)}
function acquisitionView(){const run=activeRun(),upstream=project.completed.includes('program');return card('运行与采集状态',`<div class="notice ${run?.status==='collected'?'green':''}">${run?run.status==='collected'?`✓ 已${run.mode==='public_replay'?'回放公开数据':'导入采集文件'} · ${run.measurements.length} 条测量`:'运行快照已冻结，等待数据':'先确认样品、板位和程序，再创建运行快照。'}</div>${run?`<div class="runline"><strong class="mono">RUN ${esc(run.id.slice(0,12))}</strong><small>${esc(new Date(run.started_at).toLocaleString())}<br>设计 SHA-256：${esc(run.design_sha256)}</small></div>`:''}<div class="actions">${project.demo_key?`<button class="btn primary" data-action="replay" ${!upstream||run?.status==='collected'?'disabled':''}>▶ 回放公开测量数据</button>`:''}<button class="btn" data-action="new-run" ${!upstream?'disabled':''}>＋ 新运行（保留旧快照）</button></div><p class="hint" style="margin-top:12px">回放读取公开文件中的真实观测，不模拟硬件执行。已经采集的运行不能被覆盖；新运行使用当前设计。</p>`)+card('导入真实采集文件',`<label class="field">采集文件<input id="acquisitionFile" type="file" accept=".csv,.rdml,.rdm,.xml"></label><div class="actions"><button class="btn primary" data-action="import" ${!upstream||run?.status==='collected'?'disabled':''}>导入并核对板位</button>${run?.status==='collected'?`<a class="btn" href="${exportUrl('acquisition.csv')}">下载当前数据长表</a>`:''}</div><details style="margin-top:17px"><summary class="small">数据格式与真实数据替换位置</summary><p class="hint" style="margin-top:10px">支持既有 tidy CSV（position,sample_name,target_name,cq）、长表扩增 CSV，以及 RDML 首个运行。原始样品名称与孔位必须匹配设计。熔解长表可使用以下格式，kind 为 ct / amplification / melting：</p><pre class="mono small" style="overflow:auto">well,assay_id,instrument_cq,kind,x,fluorescence\nA01,target,24.5,amplification,1,150\nA01,target,24.5,melting,65,1800</pre><p class="hint">真实数据替换点：workbench/acquisition.py 的 read_acquisition；硬件 SDK 将来接入同一采集边界。上传上限 64 MiB；文件导入后保存 SHA-256。</p></details>`)+card('运行历史',project.runs.length?project.runs.slice().reverse().map(r=>`<div class="runline"><strong>${esc(r.id.slice(0,12))} · ${r.status==='collected'?'已采集':'等待数据'} ${r.id== function svgChart(series,xLabel,yLabel,{points=false,line=null,marker=null,stats=''}={}){
 const t=theme(),valid=series.filter(s=>s.points.length),all=valid.flatMap(s=>s.points);if(!all.length)return '<div class="empty">未提供此类观测，保留数据缺口</div>';
 let xmin=Math.min(...all.map(p=>p[0])),xmax=Math.max(...all.map(p=>p[0])),ymin=Math.min(0,...all.map(p=>p[1])),ymax=Math.max(...all.map(p=>p[1]));if(xmin===xmax)xmax=xmin+1;if(ymin===ymax)ymax=ymin+1;ymax+=(ymax-ymin)*.08;
 const X=x=>65+(x-xmin)/(xmax-xmin)*470,Y=y=>273-(y-ymin)/(ymax-ymin)*220,compact=n=>Math.abs(n)>=10000?n.toExponential(1):fmt(n,1),id='fill'+(++svgCounter);
 let svg=`<svg class="chart" viewBox="0 0 600 350" role="img" aria-label="${esc(yLabel+' / '+xLabel)}"><rect width="600" height="350" rx="10" fill="${t.background}"/><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${t.palette[0]}" stop-opacity=".18"/><stop offset="1" stop-color="${t.palette[0]}" stop-opacity=".01"/></linearGradient></defs>`;
 for(let i=0;i<5;i++){const yy=ymin+(ymax-ymin)*i/4,xx=xmin+(xmax-xmin)*i/4;svg+=`<path d="M65 ${Y(yy)}H535" stroke="${t.grid}" stroke-dasharray="2 5"/><text style="fill:${t.ink}" x="55" y="${Y(yy)+4}" text-anchor="end">${compact(yy)}</text><text style="fill:${t.ink}" x="${X(xx)}" y="295" text-anchor="middle">${compact(xx)}</text>`}
 svg+=`<path d="M65 48V273H535" fill="none" stroke="${t.grid}"/>`;
 valid.forEach((s,i)=>{const color=s.color||t.palette[i%t.palette.length],coords=s.points.map(p=>X(p[0])+','+Y(p[1])).join(' ');if(!points){if(s.fill)svg+=`<polygon points="${X(s.points[0][0])},${Y(0)} ${coords} ${X(s.points.at(-1)[0])},${Y(0)}" fill="url(#${id})"/>`;svg+=`<polyline points="${coords}" fill="none" stroke="${color}" stroke-width="${s.highlight===false?1.15:2.3}" opacity="${s.highlight===false?.35:1}" stroke-dasharray="${s.dash||''}"/>`}else svg+=s.points.map((p,j)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.4" fill="${color}" stroke="${t.background}" stroke-width="1.2"/>`).join('')});
 if(line)svg+=`<path d="M${X(xmin)} ${Y(line(xmin))}L${X(xmax)} ${Y(line(xmax))}" stroke="${t.palette[1]}" stroke-width="1.8"/>`;
 if(marker!==null&&marker>=xmin&&marker<=xmax)svg+=`<path d="M${X(marker)} 48V273" stroke="${t.palette[0]}" opacity=".6" stroke-dasharray="4 4"/><text style="fill:${t.ink}" x="${Math.min(X(marker)+7,470)}" y="42">${esc('Tm '+fmt(marker,2)+' °C')}</text>`;
 if(stats)svg+=`<text style="fill:${t.ink}" x="530" y="27" text-anchor="end">${esc(stats)}</text>`;
 const legend=[...new Map(valid.filter(s=>s.label).map(s=>[s.label,s])).values()].slice(0,4);svg+=legend.map((s,i)=>`<circle cx="${70+i*128}" cy="335" r="3" fill="${s.color||t.palette[i%t.palette.length]}"/><text style="fill:${t.ink}" x="${78+i*128}" y="339">${esc(s.label.length>17?s.label.slice(0,16)+'…':s.label)}</text>`).join('');
 return svg+`<text style="fill:${t.ink}" x="300" y="319" text-anchor="middle">${esc(xLabel)}</text><text style="fill:${t.ink};font-size:14px;font-weight:600" x="65" y="27">${esc(yLabel)}</text></svg>`
}

 if(name==='import'){const file=$('#acquisitionFile').files[0];if(!file)throw Error('请先选择采集文件');const form=new FormData();form.append('file',file);form.append('revision',project.revision);const data=await api(`/api/qpcr/projects/${project.id}/acquire`,{method:'POST',body:form});project=data.project;render();toast('已核对设计并导入采集文件');return}
 syncInputs();
 if(name==='add-sample'){draft.samples.push({id:'sample_'+crypto.randomUUID().slice(0,8),name:'新样品',kind:'unknown',group:'',quantity:null,unit:'copies/reaction',notes:''});renderDraft()}
 if(name==='add-assay'){draft.assays.push({id:'assay_'+crypto.randomUUID().slice(0,8),name:'新检测项目',forward:'',reverse:'',probe:'',chemistry:'dye',channel:'SYBR/FAM',reference:false,expected_tm:null});renderDraft()}
 if(name==='add-component'){draft.recipe.components.push({name:'新组分',volume_ul:0});renderDraft()}
 if(name==='add-thermal'){draft.program.steps.push({name:'新步骤',temperature_c:60,seconds:30,cycles:1,acquire:false});renderDraft()}
 if(name==='assign'){if(!selectedWell)throw Error('请先选择一个孔位');const sid=$('#assignSample').value,aid=$('#assignAssay').value;if(!sid||!aid)throw Error('请先登记样品与检测项目');draft.plate=draft.plate.filter(a=>!(a.well===selectedWell&&a.assay_id===aid));draft.plate.push({well:selectedWell,sample_id:sid,assay_id:aid});drawPlate();changed()}
 if(name==='clear-well'){if(!selectedWell)throw Error('请先选择一个孔位');draft.plate=draft.plate.filter(a=>a.well!==selectedWell);drawPlate();changed()}
 if(name==='autoplate'){const n=Number($('#replicates').value);if(!Number.isInteger(n)||n<1||n>12)throw Error('技术重复数必须为 1–12');if(draft.samples.length*draft.assays.length*n>draft.plate_format)throw Error('所需孔数超过板容量');let pos=0;draft.plate=[];const cols=draft.plate_format===384?24:12;for(const s of draft.samples)for(const a of draft.assays)for(let i=0;i<n;i++){draft.plate.push({well:String.fromCharCode(65+Math.floor(pos/cols))+String(pos%cols+1).padStart(2,'0'),sample_id:s.id,assay_id:a.id});pos++}drawPlate();changed()}}
document.addEventListener('input',event=>{if(event.target.matches('[data-path],[data-reference],[data-efficiency],[data-efficiency-source],#channelList'))changed()});
document.addEventListener('change',event=>{if(event.target.matches('[data-path],[data-reference],[data-efficiency],[data-efficiency-source]')){if(event.target.dataset.numeric){draft[event.target.dataset.path]=Number(event.target.value);drawPlate()}changed()}if(event.target.dataset.path?.startsWith('presentation.')){syncInputs();if(current==='curves')drawCurves();if(current==='analysis')drawAnalysis()}if(event.target.id==='curveSelect')drawCurves();if(event.target.id==='projectSelect')run(()=>loadProject(event.target.value));if(event.target.id==='channelList'){draft.program.channels=event.target.value.split(',').map(s=>s.trim()).filter(Boolean);changed()}});
async function run(fn){if(busy)return;busy=true;document.body.classList.add('busy');try{await fn()}catch(error){toast(error.message,true)}finally{busy=false;document.body.classList.remove('busy')}}
document.addEventListener('click',event=>{const figure=event.target.closest('[data-figure]');if(figure&&dirty){event.preventDefault();run(async()=>{const url=figure.href;await saveCurrent();window.location.href=url});return}const btn=event.target.closest('button');if(!btn||btn.disabled)return;if(btn.dataset.template)run(()=>create(null,btn.dataset.template));else if(btn.dataset.theme)run(()=>chooseTheme(btn.dataset.theme));else if(btn.dataset.nav)run(()=>navigate(btn.dataset.nav));else if(btn.dataset.demo)run(()=>create(btn.dataset.demo));else if(btn.dataset.action)run(()=>action(btn.dataset.action));else if(btn.dataset.well){selectedWell=btn.dataset.well;drawPlate()}else if(btn.dataset.remove){syncInputs();const [path,index]=btn.dataset.remove.split(':');let obj=draft;for(const key of path.split('.'))obj=obj[key];obj.splice(Number(index),1);renderDraft()}});
document.querySelector('#restoreProjectBackup').addEventListener('click',()=>document.querySelector('#projectBackupFile').click());
document.querySelector('#projectBackupFile').addEventListener('change',event=>run(async()=>{const file=event.target.files[0];if(!file)return;try{if(file.size>64*1024*1024)throw Error('备份超过 64 MiB，请通过原数据库备份恢复');await saveCurrent();const raw=await file.text();JSON.parse(raw);const response=await api('/api/qpcr/projects/import',{method:'POST',body:raw});await refreshList();await loadProject(response.project.id);toast('已恢复为新项目；原项目保留。历史分析保留供审阅，请重新确认定量。')}finally{event.target.value=''}}));
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
(async()=>{try{catalog=await api('/api/qpcr/templates');await refreshList();const id=localStorage.getItem('qpcr-project');if(projects.length)await loadProject(projects.some(p=>p.id===id)?id:projects[0].id);else render()}catch(error){toast(error.message,true)}})();
</script>
</body></html>
